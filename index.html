<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Aura Pro Studio</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    background:#07080c;
    color:#f5f7fb;
    font-family:Arial,Helvetica,sans-serif;
}

button,input,select,textarea{font:inherit}

button{cursor:pointer}

header{
    height:64px;
    display:flex;
    align-items:center;
    padding:0 16px;
    background:#090a0f;
    border-bottom:1px solid #292e3a;
    position:sticky;
    top:0;
    z-index:20;
}

.logo{
    font-size:20px;
    font-weight:900;
}

.logo span{
    color:#ff7417;
}

.settings{
    margin-left:auto;
    width:42px;
    height:42px;
    border-radius:12px;
    border:1px solid #292e3a;
    background:#10131a;
    color:white;
}

main{
    max-width:1100px;
    margin:auto;
    padding:14px 14px 125px;
}

.search{
    width:100%;
    height:48px;
    padding:0 15px;
    border-radius:14px;
    border:1px solid #292e3a;
    background:#10131a;
    color:white;
    outline:none;
}

nav{
    display:flex;
    gap:7px;
    overflow-x:auto;
    padding:12px 0;
}

nav button,
.graphTabs button{
    white-space:nowrap;
    background:#10131a;
    color:#9ba2b2;
    border:1px solid #292e3a;
    border-radius:11px;
    padding:10px 13px;
}

nav button.active,
.graphTabs button.active{
    background:#ff7417;
    color:#111;
    border-color:#ff7417;
    font-weight:bold;
}

.hero{
    padding:26px;
    border-radius:24px;
    border:1px solid #292e3a;
    background:
        radial-gradient(circle at 90% 10%,#ff741755,transparent 35%),
        #151820;
}

.hero small{
    color:#ffb15c;
    font-weight:bold;
}

.hero h1{
    margin:9px 0;
    font-size:30px;
}

.hero p{
    color:#8e96a7;
}

.upload{
    margin:18px 0;
    padding:25px;
    display:grid;
    gap:10px;
    text-align:center;
    border:1px dashed #3a404d;
    border-radius:20px;
    background:#10131a;
}

.upload span{
    color:#8e96a7;
}

.orange{
    background:#ff7417;
    color:#111;
    border:0;
    padding:12px 16px;
    border-radius:11px;
    font-weight:bold;
}

h2{
    margin:18px 0 10px;
}

.song{
    display:flex;
    align-items:center;
    gap:11px;
    padding:9px;
    margin:7px 0;
    border-radius:14px;
    border:1px solid #292e3a;
    background:#10131a;
}

.cover{
    width:54px;
    height:54px;
    flex-shrink:0;
    border-radius:12px;
    display:grid;
    place-items:center;
    font-size:23px;
    background:linear-gradient(135deg,#303644,#151820);
}

.songInfo{
    flex:1;
    min-width:0;
}

.songInfo b,
.songInfo small{
    display:block;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.songInfo small{
    color:#8e96a7;
    margin-top:4px;
}

.song button{
    width:40px;
    height:40px;
    border-radius:11px;
    border:1px solid #292e3a;
    background:#171b24;
    color:#ffb15c;
}

.panel{
    padding:22px;
    border-radius:20px;
    border:1px solid #292e3a;
    background:#10131a;
}

.graphTabs{
    display:flex;
    gap:7px;
    overflow-x:auto;
    margin-bottom:10px;
}

.graph{
    width:100%;
    height:390px;
    overflow:hidden;
    border-radius:22px;
    border:1px solid #292e3a;
    background:#050609;
}

canvas{
    width:100%;
    height:100%;
    display:block;
}

.metrics{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:8px;
    margin-top:12px;
}

.metric{
    padding:12px;
    border-radius:13px;
    background:#10131a;
    border:1px solid #292e3a;
    color:#8e96a7;
    font-size:11px;
}

.metric strong{
    display:block;
    color:#ffb15c;
    font-size:18px;
    margin-top:4px;
}

.eq{
    display:flex;
    justify-content:space-around;
    align-items:end;
    height:300px;
    overflow-x:auto;
}

.eqBand{
    display:flex;
    flex-direction:column;
    align-items:center;
    color:#8e96a7;
    font-size:10px;
}

.eqBand input{
    height:220px;
    writing-mode:vertical-lr;
    direction:rtl;
    accent-color:#ff7417;
}

select,
textarea{
    width:100%;
    background:#171b24;
    color:white;
    border:1px solid #292e3a;
    border-radius:11px;
    padding:12px;
}

textarea{
    min-height:170px;
}

.empty{
    text-align:center;
    color:#8e96a7;
    padding:35px;
}

footer{
    position:fixed;
    left:0;
    right:0;
    bottom:0;
    z-index:30;
    background:#0c0e13ee;
    backdrop-filter:blur(18px);
    border-top:1px solid #292e3a;
}

.progress{
    height:3px;
    background:#292e3a;
}

.progress span{
    display:block;
    width:0;
    height:100%;
    background:#ff7417;
}

.player{
    max-width:1100px;
    margin:auto;
    display:flex;
    align-items:center;
    gap:10px;
    padding:8px;
}

.player .cover{
    width:46px;
    height:46px;
}

.now{
    flex:1;
    min-width:0;
}

.now b,
.now small{
    display:block;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.now small{
    color:#8e96a7;
    font-size:11px;
    margin-top:3px;
}

.player button{
    width:42px;
    height:42px;
    border-radius:50%;
    background:#171b24;
    border:1px solid #292e3a;
    color:white;
}

.player .play{
    background:#ff7417;
    color:#111;
    border:0;
}

@media(max-width:600px){

    .graph{
        height:320px;
    }

    .metrics{
        grid-template-columns:repeat(2,1fr);
    }

    .eq{
        height:270px;
    }

    .eqBand input{
        height:190px;
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">
        AURA <span>PRO</span> STUDIO
    </div>

    <button class="settings">⚙</button>
</header>

<main>

<input
    id="search"
    class="search"
    placeholder="🔎 Buscar músicas..."
>

<nav id="nav">

<button class="active" data-page="home">Início</button>
<button data-page="library">Biblioteca</button>
<button data-page="favorites">Favoritos</button>
<button data-page="playlists">Playlists</button>
<button data-page="eq">EQ</button>
<button data-page="visualizer">Visualizer</button>
<button data-page="lyrics">Letras</button>

</nav>

<section id="content"></section>

</main>

<footer>

<div class="progress">
    <span id="progressBar"></span>
</div>

<div class="player">

<div class="cover">♪</div>

<div class="now">
    <b id="currentTitle">Nenhuma música</b>
    <small id="currentArtist">Aura Pro Studio</small>
</div>

<button id="previous">⏮</button>

<button id="playButton" class="play">▶</button>

<button id="next">⏭</button>

</div>

</footer>

<input
    id="fileInput"
    type="file"
    accept="audio/*"
    multiple
    hidden
>

<script>

const content = document.getElementById("content");
const search = document.getElementById("search");

let songs = [];
let currentIndex = -1;

let audio = new Audio();

let audioContext = null;
let sourceNode = null;
let analyser = null;
let masterGain = null;
let filters = [];

let visualizerMode = "spectrum";
let animationFrame = null;


/* =========================
   DATABASE LOCAL
========================= */

const DB_NAME = "AuraProStudioDB";
const STORE = "songs";

function openDB(){

    return new Promise((resolve,reject)=>{

        const request =
            indexedDB.open(DB_NAME,1);

        request.onupgradeneeded = e => {

            const db = e.target.result;

            if(!db.objectStoreNames.contains(STORE)){

                db.createObjectStore(
                    STORE,
                    {keyPath:"id"}
                );

            }

        };

        request.onsuccess =
            () => resolve(request.result);

        request.onerror =
            () => reject(request.error);

    });

}


async function saveSong(song){

    const db = await openDB();

    return new Promise((resolve,reject)=>{

        const tx =
            db.transaction(STORE,"readwrite");

        tx.objectStore(STORE).put(song);

        tx.oncomplete = resolve;
        tx.onerror = () => reject(tx.error);

    });

}


async function loadSongs(){

    const db = await openDB();

    return new Promise((resolve,reject)=>{

        const tx =
            db.transaction(STORE,"readonly");

        const request =
            tx.objectStore(STORE).getAll();

        request.onsuccess =
            () => resolve(request.result);

        request.onerror =
            () => reject(request.error);

    });

}


/* =========================
   UPLOAD
========================= */

async function importFiles(files){

    for(const file of files){

        const id =
            Date.now()+"-"+Math.random();

        const buffer =
            await file.arrayBuffer();

        const blob =
            new Blob(
                [buffer],
                {type:file.type}
            );

        const song = {

            id:id,

            name:
                file.name.replace(/\.[^/.]+$/,""),

            artist:
                "Arquivo local",

            blob:blob

        };

        await saveSong(song);

        songs.push(song);

    }

    renderPage("library");

}


/* =========================
   AUDIO ENGINE
========================= */

async function setupAudio(){

    if(audioContext)
        return;

    audioContext =
        new (
            window.AudioContext ||
            window.webkitAudioContext
        )();

    sourceNode =
        audioContext.createMediaElementSource(audio);

    analyser =
        audioContext.createAnalyser();

    analyser.fftSize = 2048;

    analyser.smoothingTimeConstant = 0.90;

    masterGain =
        audioContext.createGain();

    masterGain.gain.value = 0.9;

    let node = sourceNode;

    const frequencies =
        [
            32,
            64,
            125,
            250,
            500,
            1000,
            2000,
            4000,
            8000,
            16000
        ];

    filters = [];

    for(const frequency of frequencies){

        const filter =
            audioContext.createBiquadFilter();

        filter.type = "peaking";

        filter.frequency.value =
            frequency;

        filter.Q.value = 0.8;

        filter.gain.value = 0;

        node.connect(filter);

        node = filter;

        filters.push(filter);

    }

    node.connect(masterGain);

    masterGain.connect(analyser);

    analyser.connect(
        audioContext.destination
    );

}


/* =========================
   PLAY
========================= */

async function playSong(index){

    if(index < 0 || index >= songs.length)
        return;

    currentIndex = index;

    const song =
        songs[index];

    if(!song.blob)
        return;

    await setupAudio();

    if(audioContext.state === "suspended")
        await audioContext.resume();

    const url =
        URL.createObjectURL(song.blob);

    audio.src = url;

    document.getElementById(
        "currentTitle"
    ).textContent = song.name;

    document.getElementById(
        "currentArtist"
    ).textContent = song.artist;

    try{

        await audio.play();

    }catch(error){

        console.log(error);

    }

}


function nextSong(){

    if(!songs.length)
        return;

    currentIndex =
        (currentIndex+1) %
        songs.length;

    playSong(currentIndex);

}


function previousSong(){

    if(!songs.length)
        return;

    currentIndex =
        (currentIndex-1+songs.length) %
        songs.length;

    playSong(currentIndex);

}


document
    .getElementById("playButton")
    .onclick = async ()=>{

        if(!audio.src){

            if(songs.length)
                await playSong(0);

            return;

        }

        if(audio.paused){

            if(audioContext &&
               audioContext.state==="suspended"){

                await audioContext.resume();

            }

            audio.play();

        }else{

            audio.pause();

        }

    };


document
    .getElementById("next")
    .onclick =
        nextSong;


document
    .getElementById("previous")
    .onclick =
        previousSong;


audio.onplay = ()=>{

    document.getElementById(
        "playButton"
    ).textContent = "Ⅱ";

};


audio.onpause = ()=>{

    document.getElementById(
        "playButton"
    ).textContent = "▶";

};


audio.ontimeupdate = ()=>{

    if(!audio.duration)
        return;

    document.getElementById(
        "progressBar"
    ).style.width =
        (
            audio.currentTime /
            audio.duration *
            100
        )+"%";

};


audio.onended =
    nextSong;


/* =========================
   PÁGINAS
========================= */

function renderPage(page){

    document
        .querySelectorAll("[data-page]")
        .forEach(button=>{

            button.classList.toggle(
                "active",
                button.dataset.page===page
            );

        });

    if(page==="home")
        renderHome();

    if(page==="library")
        renderLibrary();

    if(page==="favorites")
        renderFavorites();

    if(page==="playlists")
        renderPlaylists();

    if(page==="eq")
        renderEQ();

    if(page==="visualizer")
        renderVisualizer();

    if(page==="lyrics")
        renderLyrics();

}


function renderHome(){

    content.innerHTML = `

    <div class="hero">

        <small>AURA PRO STUDIO V3</small>

        <h1>
            Seu som. Seu estúdio.
        </h1>

        <p>
            Player premium com biblioteca,
            equalizador e visualizer.
        </p>

    </div>

    <div class="upload">

        <b>
            Adicionar músicas
        </b>

        <span>
            As músicas ficam armazenadas
            localmente no navegador.
        </span>

        <button
            class="orange"
            id="uploadButton"
        >
            ＋ Selecionar músicas
        </button>

    </div>

    <h2>
        Suas músicas
    </h2>

    <div id="songList"></div>

    `;

    document
        .getElementById("uploadButton")
        .onclick =
            ()=>document
                .getElementById("fileInput")
                .click();

    renderSongList();

}


function renderLibrary(){

    content.innerHTML = `

        <h2>
            Biblioteca
        </h2>

        <div id="songList"></div>

    `;

    renderSongList();

}


function renderSongList(){

    const list =
        document.getElementById(
            "songList"
        );

    if(!list)
        return;

    const query =
        search.value.toLowerCase();

    const filtered =
        songs.filter(song=>
            song.name
                .toLowerCase()
                .includes(query)
        );

    if(!filtered.length){

        list.innerHTML =
            `<div class="empty">
                Nenhuma música encontrada.
            </div>`;

        return;

    }

    list.innerHTML =
        filtered.map(song=>{

            const index =
                songs.indexOf(song);

            return `

            <article class="song">

                <div class="cover">
                    ♪
                </div>

                <div class="songInfo">

                    <b>
                        ${escapeHTML(song.name)}
                    </b>

                    <small>
                        ${escapeHTML(song.artist)}
                    </small>

                </div>

                <button
                    onclick="playSong(${index})"
                >
                    ▶
                </button>

            </article>

            `;

        }).join("");

}


function renderFavorites(){

    content.innerHTML = `

        <h2>
            Favoritos
        </h2>

        <div class="empty">

            ❤️ Suas músicas favoritas
            aparecerão aqui.

        </div>

    `;

}


function renderPlaylists(){

    content.innerHTML = `

        <h2>
            Playlists
        </h2>

        <div class="panel">

            <input
                id="playlistName"
                placeholder="Nome da playlist"
            >

            <br><br>

            <button
                class="orange"
                onclick="createPlaylist()"
            >
                ＋ Criar playlist
            </button>

        </div>

    `;

}


function createPlaylist(){

    const name =
        document
            .getElementById("playlistName")
            .value;

    if(!name)
        return;

    alert(
        "Playlist criada: "+name
    );

}


function renderEQ(){

    content.innerHTML = `

    <h2>
        Equalizador
    </h2>

    <div class="panel">

        <select id="preset">

            <option value="normal">
                Normal
            </option>

            <option value="bass">
                Bass
            </option>

            <option value="rock">
                Rock
            </option>

            <option value="pop">
                Pop
            </option>

            <option value="vocal">
                Vocal
            </option>

            <option value="dance">
                Dance
            </option>

        </select>

        <div class="eq">

            ${[
                "32",
                "64",
                "125",
                "250",
                "500",
                "1K",
                "2K",
                "4K",
                "8K",
                "16K"
            ].map((freq,i)=>`

                <div class="eqBand">

                    <input
                        class="eqSlider"
                        data-index="${i}"
                        type="range"
                        min="-12"
                        max="12"
                        value="0"
                    >

                    <span>
                        ${freq}
                    </span>

                </div>

            `).join("")}

        </div>

    </div>

    `;

    document
        .querySelectorAll(".eqSlider")
        .forEach(slider=>{

            slider.oninput =
                ()=>{

                    const index =
                        slider.dataset.index;

                    const value =
                        Number(slider.value);

                    if(filters[index]){

                        filters[index]
                            .gain
                            .setTargetAtTime(
                                value,
                                audioContext.currentTime,
                                0.025
                            );

                    }

                };

        });

    document
        .getElementById("preset")
        .onchange =
            applyPreset;

}


function applyPreset(){

    const value =
        document
            .getElementById("preset")
            .value;

    let gains =
        new Array(10).fill(0);

    if(value==="bass")
        gains=[5,6,5,3,1,0,0,0,1,2];

    if(value==="rock")
        gains=[4,3,2,-1,-2,2,3,4,4,3];

    if(value==="pop")
        gains=[1,2,1,0,-1,2,3,2,2,1];

    if(value==="vocal")
        gains=[-2,-1,0,2,4,5,4,2,0,-1];

    if(value==="dance")
        gains=[5,4,3,0,-1,1,3,4,5,4];

    filters.forEach(
        (filter,i)=>{

            filter.gain
                .setTargetAtTime(
                    gains[i],
                    audioContext.currentTime,
                    0.04
                );

        }
    );

}


function renderVisualizer(){

    content.innerHTML = `

    <h2>
        Visualizer & Gráficos
    </h2>

    <div class="graphTabs">

        <button
            class="active"
            data-mode="spectrum"
        >
            Spectrum
        </button>

        <button data-mode="wave">
            Wave
        </button>

        <button data-mode="bands">
            10 Bandas
        </button>

        <button data-mode="circle">
            Circular
        </button>

        <button data-mode="mirror">
            Mirror
        </button>

        <button data-mode="beat">
            Beat
        </button>

    </div>

    <div class="graph">

        <canvas id="visualizerCanvas"></canvas>

    </div>

    <div class="metrics">

        <div class="metric">
            BASS
            <strong id="bass">0%</strong>
        </div>

        <div class="metric">
            MÉDIOS
            <strong id="mids">0%</strong>
        </div>

        <div class="metric">
            AGUDOS
            <strong id="treble">0%</strong>
        </div>

        <div class="metric">
            ENERGIA
            <strong id="energy">0%</strong>
        </div>

    </div>

    `;

    document
        .querySelectorAll("[data-mode]")
        .forEach(button=>{

            button.onclick = ()=>{

                document
                    .querySelectorAll("[data-mode]")
                    .forEach(b=>
                        b.classList.remove(
                            "active"
                        )
                    );

                button.classList.add(
                    "active"
                );

                visualizerMode =
                    button.dataset.mode;

            };

        });

    startVisualizer();

}


function startVisualizer(){

    cancelAnimationFrame(
        animationFrame
    );

    const canvas =
        document.getElementById(
            "visualizerCanvas"
        );

    if(!canvas)
        return;

    const ctx =
        canvas.getContext("2d");

    function draw(){

        animationFrame =
            requestAnimationFrame(draw);

        const width =
            canvas.clientWidth;

        const height =
            canvas.clientHeight;

        const dpr =
            window.devicePixelRatio || 1;

        if(
            canvas.width !==
            width*dpr
        ){

            canvas.width =
                width*dpr;

            canvas.height =
                height*dpr;

            ctx.setTransform(
                dpr,0,0,dpr,0,0
            );

        }

        ctx.clearRect(
            0,
            0,
            width,
            height
        );

        ctx.fillStyle =
            "#050609";

        ctx.fillRect(
            0,
            0,
            width,
            height
        );

        if(!analyser){

            ctx.fillStyle =
                "#777";

            ctx.textAlign =
                "center";

            ctx.fillText(
                "Reproduza uma música para ativar o gráfico",
                width/2,
                height/2
            );

            return;

        }

        const frequencyData =
            new Uint8Array(
                analyser.frequencyBinCount
            );

        const waveData =
            new Uint8Array(
                analyser.fftSize
            );

        analyser.getByteFrequencyData(
            frequencyData
        );

        analyser.getByteTimeDomainData(
            waveData
        );

        let bass =
            average(
                frequencyData,
                0,
                15
            );

        let mids =
            average(
                frequencyData,
                15,
                100
            );

        let treble =
            average(
                frequencyData,
                100,
                350
            );

        document.getElementById(
            "bass"
        ).textContent =
            Math.round(bass*100)+"%";

        document.getElementById(
            "mids"
        ).textContent =
            Math.round(mids*100)+"%";

        document.getElementById(
            "treble"
        ).textContent =
            Math.round(treble*100)+"%";

        document.getElementById(
            "energy"
        ).textContent =
            Math.round(
                (bass+mids+treble)/3*100
            )+"%";

        ctx.strokeStyle =
            "#ffffff12";

        for(let i=1;i<8;i++){

            ctx.beginPath();

            ctx.moveTo(
                0,
                height*i/8
            );

            ctx.lineTo(
                width,
                height*i/8
            );

            ctx.stroke();

        }

        ctx.strokeStyle =
            "#ff7417";

        ctx.fillStyle =
            "#ff7417";

        if(visualizerMode==="wave"){

            ctx.beginPath();

            waveData.forEach(
                (value,i)=>{

                    const x =
                        i/
                        waveData.length*
                        width;

                    const y =
                        height/2+
                        (value-128)/
                        128*
                        height*.4;

                    if(i===0)
                        ctx.moveTo(x,y);
                    else
                        ctx.lineTo(x,y);

                }
            );

            ctx.lineWidth=2.5;

            ctx.stroke();

        }else if(
            visualizerMode==="circle"
        ){

            const cx =
                width/2;

            const cy =
                height/2;

            const radius =
                Math.min(
                    width,
                    height
                )*.16;

            for(
                let i=0;
                i<100;
                i++
            ){

                const angle =
                    i/
                    100*
                    Math.PI*2;

                const value =
                    frequencyData[i]/
                    255;

                const r2 =
                    radius+
                    value*
                    Math.min(
                        width,
                        height
                    )*.35;

                ctx.beginPath();

                ctx.moveTo(
                    cx+
                    Math.cos(angle)*
                    radius,
                    cy+
                    Math.sin(angle)*
                    radius
                );

                ctx.lineTo(
                    cx+
                    Math.cos(angle)*
                    r2,
                    cy+
                    Math.sin(angle)*
                    r2
                );

                ctx.stroke();

            }

            ctx.beginPath();

            ctx.arc(
                cx,
                cy,
                radius,
                0,
                Math.PI*2
            );

            ctx.stroke();

        }else{

            const count =
                visualizerMode==="bands"
                ?10
                :64;

            const gap=2;

            const barWidth =
                (
                    width-
                    gap*(count-1)
                )/
                count;

            for(
                let i=0;
                i<count;
                i++
            ){

                const index =
                    Math.floor(
                        i/count*
                        frequencyData.length
                    );

                const value =
                    frequencyData[index]/
                    255;

                const barHeight =
                    Math.max(
                        3,
                        value*height*.86
                    );

                const x =
                    i*
                    (barWidth+gap);

                if(
                    visualizerMode==="mirror"
                ){

                    ctx.fillRect(
                        x,
                        height/2-
                        barHeight/2,
                        barWidth,
                        barHeight
                    );

                }else{

                    ctx.fillRect(
                        x,
                        height-
                        barHeight,
                        barWidth,
                        barHeight
                    );

                }

            }

        }

    }

    draw();

}


function average(data,start,end){

    let total=0;
    let count=0;

    for(
        let i=start;
        i<end &&
        i<data.length;
        i++
    ){

        total+=data[i];
        count++;

    }

    return count
        ? total/count/255
        : 0;

}

function escapeHTML(text){

    const div =
        document.createElement(
            "div"
        );

    div.textContent =
        text;

    return div.innerHTML;

}
